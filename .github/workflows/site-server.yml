# Uploads the startup website from site/ to the project's own server over SSH; nginx serves it on port 80.
# One-time setup in Settings → Secrets and variables → Actions → Secrets:
#   SSH_HOST         server address
#   SSH_PRIVATE_KEY  private deploy key; its public half goes to ~/.ssh/authorized_keys of SSH_USER on the server
# Optional variables (same page, tab Variables): SSH_USER (default root), SITE_DIR (default /var/www/phenoplant),
# SSH_KNOWN_HOSTS secret to pin the server's host key instead of reading it with ssh-keyscan.
name: Site to server

on:
  push:
    branches: [main]
    paths: ["site/**", "deploy/site-server/**", ".github/workflows/site-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-server
  cancel-in-progress: false  # never stop an upload halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'root' }}
      SITE_DIR: ${{ vars.SITE_DIR || '/var/www/phenoplant' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the SSH_HOST and SSH_PRIVATE_KEY secrets (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host site\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Prepare the server
        run: ssh site "SITE_DIR='$SITE_DIR' bash -s" < deploy/site-server/setup.sh

      - name: Upload the site
        run: rsync -rlptz --delete --chmod=D755,F644 --exclude README.md site/ "site:$SITE_DIR/"

      - name: Check the site answers
        run: |
          if curl -fsS --max-time 20 "http://$SSH_HOST/" | grep -q PhenoPlant; then
            echo "Site is live: http://$SSH_HOST/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Files are on the server, but http://$SSH_HOST/ did not answer from the internet. Open port 80 in the server's firewall."
          fi
