# Uploads the startup website from site/ to the project's own server over SSH; nginx serves it
# at https://SITE_DOMAIN with a Let's Encrypt certificate (plain http on the address while there is none).
# One-time setup in Settings → Secrets and variables → Actions → Secrets (repository secrets):
#   SSH_HOST         server address
#   SSH_PRIVATE_KEY  private deploy key; its public half goes to ~/.ssh/authorized_keys of SSH_USER on the server
# Optional variables (same page, tab Variables): SITE_DOMAIN (default phenoplant.ru), CERT_EMAIL for
# Let's Encrypt expiry notices, SSH_USER (default root), SITE_DIR (default /var/www/phenoplant);
# SSH_KNOWN_HOSTS secret to pin the server's host key instead of reading it with ssh-keyscan.
name: Site to server

on:
  push:
    branches: [main]
    paths: ["site/**", "deploy/site-server/**", ".github/workflows/site-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-server
  cancel-in-progress: false  # never stop an upload halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'root' }}
      SITE_DIR: ${{ vars.SITE_DIR || '/var/www/phenoplant' }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'phenoplant.ru' }}
      CERT_EMAIL: ${{ vars.CERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (not Environment secrets)."
              missing=1
            fi
          done
          [ -z "${missing:-}" ] || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host site\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Prepare the server
        run: ssh site "SITE_DIR='$SITE_DIR' SITE_DOMAIN='$SITE_DOMAIN' CERT_EMAIL='$CERT_EMAIL' bash -s" < deploy/site-server/setup.sh

      - name: Upload the site
        run: rsync -rlptz --delete --chmod=D755,F644 --exclude README.md site/ "site:$SITE_DIR/"

      - name: Check the site answers
        run: |
          for url in ${SITE_DOMAIN:+"https://$SITE_DOMAIN/"} "http://$SSH_HOST/"; do
            if curl -fsSL --max-time 20 "$url" | grep -q PhenoPlant; then
              echo "Site is live: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Files are on the server, but the site did not answer from the internet. Open ports 80 and 443 in the server's firewall."
