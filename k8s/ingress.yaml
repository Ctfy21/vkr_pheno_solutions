apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phenoplant-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /realms
        pathType: Prefix
        backend:
          service:
            name: keycloak-svc
            port:
              number: 8080
      - path: /resources
        pathType: Prefix
        backend:
          service:
            name: keycloak-svc
            port:
              number: 8080
      - path: /js
        pathType: Prefix
        backend:
          service:
            name: keycloak-svc
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: phenoplant-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phenoplant-frontend
            port:
              number: 80
