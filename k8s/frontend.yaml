apiVersion: apps/v1
kind: Deployment
metadata:
  name: phenoplant-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phenoplant-frontend
  template:
    metadata:
      labels:
        app: phenoplant-frontend
    spec:
      containers:
      - name: frontend
        image: phenoplant-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 32Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: phenoplant-frontend
spec:
  selector:
    app: phenoplant-frontend
  ports:
  - port: 80
    targetPort: 80
